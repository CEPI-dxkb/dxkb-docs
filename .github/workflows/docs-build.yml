name: Docs build

# The docs are consumed at runtime by the dxkb-web service info (ⓘ) dialogs, which
# fetch pages from the published site. A build that does not install or does not
# compile is invisible until a developer clones the repo and loses an afternoon --
# which is exactly how the Sphinx 2.2.0 / Jinja2 3.x ImportError reached a dev.
# This job installs from requirements.txt the same way the README tells a human to.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # sphinxcontrib-spelling links against the native enchant library; without it
      # the extension fails to import and conf.py cannot load at all.
      - name: Install enchant
        run: |
          sudo apt-get update
          sudo apt-get install -y libenchant-2-2 hunspell-en-us

      # requirements.txt floors (Sphinx>=8, myst-parser>=4) need >=3.10, and pip
      # resolves Sphinx to 9.x which needs >=3.12. Keep this in step with the README.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Not -W: the build emits ~255 warnings for missing images and unresolved
      # /tutorial/... cross-references inherited from BV-BRC-Docs. Those are known
      # and harmless to the info dialogs. This gate catches import and build FAILURE.
      - name: Build HTML
        working-directory: docroot
        run: python -m sphinx -b html . _build/html

      # A green build that produced no service pages would still break the dialogs,
      # since each widget requests its own quick_references/services/<name>.html.
      - name: Verify service pages were generated
        working-directory: docroot
        run: |
          count=$(find _build/html/quick_references/services -name '*.html' | wc -l)
          echo "Generated $count service pages."
          if [ "$count" -eq 0 ]; then
            echo "::error::No service pages were generated -- the info dialogs would 404."
            exit 1
          fi

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: html
          path: docroot/_build/html/
          retention-days: 7
